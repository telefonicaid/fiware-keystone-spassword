Listen 5001

<VirtualHost *:5001>
    WSGIDaemonProcess keystone-public processes=5 threads=1 user=keystone group=keystone python-home=/opt/keystone-venv
    WSGIProcessGroup keystone-public
    WSGIScriptAlias / /opt/keystone/keystone.wsgi
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On
    LimitRequestBody 114688
    ErrorLog /proc/1/fd/2
    CustomLog /proc/1/fd/1 combined

    <Directory /opt/keystone>
        Require all granted
    </Directory>
</VirtualHost>

Alias /identity /opt/keystone/keystone.wsgi
<Location /identity>
    SetHandler wsgi-script
    Options +ExecCGI
    WSGIProcessGroup keystone-public
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On
</Location>
