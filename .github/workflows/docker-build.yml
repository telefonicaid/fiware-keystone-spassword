name: Docker build

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - 'keystone_spassword/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'keystone_spassword/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build keystone-spassword image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: false
          tags: keystone-spassword:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
